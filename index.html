<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>설문 집계기</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --fg: #1d1d1b; --muted: #5f5f5a; --line: #d9d9d3;
  --panel: #ffffff; --accent: #2f5fd0; --accent-fg: #ffffff; --warn: #8a5300;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --fg: #ececea; --muted: #a3a39d; --line: #3a3a37;
          --panel: #1f1f1d; --accent: #7fa2ff; --accent-fg: #10131c; --warn: #e3b25c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 16px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.1rem; margin: 28px 0 8px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); font-size: .92rem; }
label { display: block; font-weight: 600; margin: 16px 0 6px; }
textarea { width: 100%; min-height: 200px; padding: 10px 12px; resize: vertical;
           font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 8;
           color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
button { font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
         border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
#status { min-height: 1.5em; margin-top: 12px; }
#status.error { color: var(--warn); font-weight: 600; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
thead th { font-size: .9rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody th { font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; }
dl.rules { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: .92rem; }
dl.rules dt { font-weight: 600; }
dl.rules dd { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>설문 집계기</h1>
  <p class="muted">붙여넣은 데이터는 이 브라우저 안에서만 계산하며, 어디로도 보내거나 저장하지 않습니다.</p>

  <label for="input">엑셀에서 머리글 줄까지 복사해 붙여넣으세요</label>
  <textarea id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="응답번호&#9;문항1&#9;문항2&#10;1&#9;5&#9;4&#10;2&#9;3&#9;"></textarea>
  <div class="actions">
    <button type="button" id="run" class="primary">집계</button>
    <button type="button" id="clear">지우기</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" hidden>
    <h2>문항별 결과</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th scope="col">문항</th><th scope="col" class="num">유효 응답</th><th scope="col" class="num">평균</th><th scope="col" class="num">빈 응답</th><th scope="col" class="num">제외</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <h2>집계 기준</h2>
  <dl class="rules">
    <dt>집계 열</dt><dd>첫 열(응답번호)은 집계하지 않고, 둘째 열부터 문항으로 봅니다.</dd>
    <dt>유효</dt><dd>앞뒤 공백을 지운 값이 1·2·3·4·5 중 하나</dd>
    <dt>빈 응답</dt><dd>비었거나 공백만 있는 칸. 칸 수가 머리글보다 모자란 줄은 모자란 칸도 빈 응답으로 셉니다.</dd>
    <dt>제외</dt><dd>그 밖의 값</dd>
    <dt>평균</dt><dd>유효 응답 합 ÷ 유효 응답 수를 소수 셋째 자리에서 반올림. 유효 응답이 없으면 "-"</dd>
  </dl>
</main>
<!-- 계산 로직: 화면(DOM)과 무관한 순수 함수만 둔다. tests/tally.test.js가 이 블록만 꺼내 시험한다. -->
<script id="tally-core">
(function (root) {
  'use strict';

  // 엑셀 복사 형식(탭 구분, 줄바꿈 \r\n / \n / \r, 필요할 때 큰따옴표로 감싼 칸)을 읽는다.
  // 길이 0인 줄(끝 줄바꿈 등)은 결과에 넣지 않는다.
  function parseTsv(text) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var fieldStart = true;
    var lineHasChars = false;
    var i = 0;
    var n = text.length;

    function endField() {
      row.push(field);
      field = '';
      fieldStart = true;
    }
    function endLine() {
      if (lineHasChars) {
        endField();
        rows.push(row);
      }
      row = [];
      field = '';
      fieldStart = true;
      lineHasChars = false;
    }

    while (i < n) {
      var c = text.charAt(i);
      if (inQuotes) {
        if (c === '"') {
          if (text.charAt(i + 1) === '"') {
            field += '"';
            i += 2;
            continue;
          }
          inQuotes = false;
        } else {
          field += c;
        }
        i += 1;
        continue;
      }
      if (c === '\r' || c === '\n') {
        endLine();
        i += (c === '\r' && text.charAt(i + 1) === '\n') ? 2 : 1;
        continue;
      }
      lineHasChars = true;
      if (c === '\t') {
        endField();
      } else if (c === '"' && fieldStart) {
        inQuotes = true;
        fieldStart = false;
      } else {
        field += c;
        fieldStart = false;
      }
      i += 1;
    }
    endLine();
    return rows;
  }

  // 'valid' | 'blank' | 'excluded'
  function classifyCell(raw) {
    if (raw === undefined || raw === null) return 'blank';
    var v = String(raw).trim();
    if (v === '') return 'blank';
    if (v.length === 1 && v >= '1' && v <= '5') return 'valid';
    return 'excluded';
  }

  // 합 ÷ 개수를 소수 셋째 자리에서 반올림해 둘째 자리까지. 정수 연산으로 오차 없이 계산한다.
  function formatAverage(sum, count) {
    if (!count) return '-';
    var hundredths = Math.floor((200 * sum + count) / (2 * count));
    var whole = Math.floor(hundredths / 100);
    var frac = String(hundredths % 100);
    if (frac.length < 2) frac = '0' + frac;
    return whole + '.' + frac;
  }

  function tally(text) {
    var rows = parseTsv(String(text == null ? '' : text));
    if (rows.length === 0) {
      return { ok: false, error: 'empty', questions: [], responseCount: 0, longRowCount: 0 };
    }
    var header = rows[0];
    if (header.length < 2) {
      return { ok: false, error: 'noQuestions', questions: [], responseCount: rows.length - 1, longRowCount: 0 };
    }
    var questions = [];
    for (var q = 1; q < header.length; q++) {
      var name = header[q].trim();
      questions.push({ name: name === '' ? '(' + (q + 1) + '열)' : name, valid: 0, sum: 0, blank: 0, excluded: 0, average: '-' });
    }
    var longRowCount = 0;
    for (var r = 1; r < rows.length; r++) {
      var cells = rows[r];
      if (cells.length > header.length) longRowCount += 1;
      for (var k = 1; k < header.length; k++) {
        var cell = cells[k];
        var item = questions[k - 1];
        var kind = classifyCell(cell);
        if (kind === 'valid') {
          item.valid += 1;
          item.sum += Number(cell.trim());
        } else if (kind === 'blank') {
          item.blank += 1;
        } else {
          item.excluded += 1;
        }
      }
    }
    for (var j = 0; j < questions.length; j++) {
      questions[j].average = formatAverage(questions[j].sum, questions[j].valid);
    }
    return { ok: true, error: null, questions: questions, responseCount: rows.length - 1, longRowCount: longRowCount };
  }

  // 개수 목록을 합이 size(기본 100)인 칸 수로 나눈다. 최대 나머지 방식이며 나머지가 같으면 앞 항목이 먼저 받는다.
  // 개수가 0인 항목은 칸을 받지 않는다. 모두 0이면 모두 0칸이다.
  function toGridCells(counts, size) {
    if (size === undefined) size = 100;
    var total = 0;
    var cells = [];
    var i;
    for (i = 0; i < counts.length; i++) total += counts[i];
    if (!total) {
      for (i = 0; i < counts.length; i++) cells.push(0);
      return cells;
    }
    var rest = [];
    var used = 0;
    for (i = 0; i < counts.length; i++) {
      var scaled = counts[i] * size;
      cells.push(Math.floor(scaled / total));
      used += cells[i];
      rest.push({ index: i, remainder: scaled % total });
    }
    rest.sort(function (a, b) { return (b.remainder - a.remainder) || (a.index - b.index); });
    for (i = 0; i < size - used; i++) cells[rest[i].index] += 1;
    return cells;
  }

  root.SurveyTally = { parseTsv: parseTsv, classifyCell: classifyCell, formatAverage: formatAverage, tally: tally, toGridCells: toGridCells };
})(globalThis);
</script>
<!-- 화면: 입력을 받아 SurveyTally.tally를 부르고 결과를 그린다. 데이터는 textContent로만 넣는다. -->
<script>
(function () {
  'use strict';
  var input = document.getElementById('input');
  var status = document.getElementById('status');
  var result = document.getElementById('result');
  var tbody = document.getElementById('rows');

  function setStatus(text, isError) {
    status.textContent = text;
    status.className = isError ? 'error' : '';
  }

  function cell(tag, text, className) {
    var el = document.createElement(tag);
    el.textContent = text;
    if (className) el.className = className;
    if (tag === 'th') el.scope = 'row';
    return el;
  }

  function render() {
    tbody.textContent = '';
    if (input.value.trim() === '') {
      result.hidden = true;
      setStatus('', false);
      return;
    }
    var out = SurveyTally.tally(input.value);
    if (!out.ok) {
      result.hidden = true;
      setStatus(out.error === 'noQuestions'
        ? '문항 열이 없습니다. 탭으로 나뉜 머리글 줄(응답번호 열 + 문항 열)까지 함께 복사했는지 확인하세요.'
        : '읽을 데이터가 없습니다.', true);
      return;
    }
    out.questions.forEach(function (q) {
      var tr = document.createElement('tr');
      tr.appendChild(cell('th', q.name));
      tr.appendChild(cell('td', String(q.valid), 'num'));
      tr.appendChild(cell('td', q.average, 'num'));
      tr.appendChild(cell('td', String(q.blank), 'num'));
      tr.appendChild(cell('td', String(q.excluded), 'num'));
      tbody.appendChild(tr);
    });
    result.hidden = false;
    var msg = '응답 ' + out.responseCount + '줄, 문항 ' + out.questions.length + '개를 집계했습니다.';
    if (out.longRowCount > 0) {
      msg += ' 머리글보다 칸이 많은 줄 ' + out.longRowCount + '개는 남는 칸을 집계하지 않았습니다.';
    }
    setStatus(msg, false);
  }

  document.getElementById('run').addEventListener('click', render);
  document.getElementById('clear').addEventListener('click', function () {
    input.value = '';
    render();
    input.focus();
  });
  input.addEventListener('paste', function () { setTimeout(render, 0); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); render(); }
  });
})();
</script>
</body>
</html>
